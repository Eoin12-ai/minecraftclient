plugins {
    id 'fabric-loom' version '1.17.20'
    id 'java'
}

version = project.mod_version
group   = project.maven_group

base { archivesName = project.archives_base_name }

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft         "com.mojang:minecraft:${project.minecraft_version}"
    mappings          "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // NanoVG is bound at compile time from libs/ and shipped as the nested jars
    // under META-INF/jars. The rest of libs/ was a pre-compiled copy of this mod
    // built against older mappings; it has no business on the compile classpath.
    compileOnly files('libs/lwjgl-nanovg-3.3.3.jar')

    compileOnly 'org.jetbrains:annotations:24.1.0'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.release   = 21
    it.options.encoding  = 'UTF-8'
}

processResources {
    inputs.property 'version', project.version
    filteringCharset 'UTF-8'
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

/**
 * Fails the build on an @Inject handler that declares an Object parameter.
 *
 * Mixin matches an @Inject against its target by raw descriptor and does not
 * treat Object as a wildcard, so one of these compiles clean, passes every
 * check here, ships, and then throws InvalidInjectionException while applying
 * -- which is fatal whatever defaultRequire says. The client dies before the
 * window opens, which is the worst way to find out.
 *
 * This is a lint, not a verifier: it does not resolve the target method, it
 * just refuses the one shape that has actually shipped broken. Our legitimate
 * Object parameters are all on @ModifyExpressionValue, hooking erased generics
 * like SimpleOption.getValue, so this cannot fire on them.
 */
tasks.register('checkMixinDescriptors') {
    def mixinDir = file('src/main/java/dev/kryptic/mixin')
    inputs.dir mixinDir
    doLast {
        def offenders = []
        mixinDir.eachFileMatch(~/.*\.java/) { f ->
            def src = f.text
            // every handler declaration, with the annotations that precede it
            def matcher = src =~ /(?s)(?:private|public|protected)\s+(?:static\s+)?[\w.<>\[\]$]+\s+(kryptic\$\w+)\s*\(([^)]*)\)/
            while (matcher.find()) {
                def head = src.substring(0, matcher.start())
                def anns = (head =~ /@(Inject|ModifyVariable|ModifyExpressionValue|ModifyReturnValue|Redirect|ModifyArg|ModifyArgs|WrapOperation)\b/)
                            .collect { it[1] }
                if (!anns || anns[-1] != 'Inject') continue
                def params = matcher.group(2).split(',')*.trim().findAll { it }
                if (params.any { it.split(/\s+/)[0] == 'Object' }) {
                    offenders << "${f.name}#${matcher.group(1)}"
                }
            }
        }
        if (offenders) {
            throw new GradleException(
                "@Inject handlers with an Object parameter (Mixin will reject these at "
                + "apply time and the client will not start): " + offenders.join(', '))
        }
    }
}

tasks.named('check') { dependsOn 'checkMixinDescriptors' }

/**
 * Fails the build if the Mixin we compile against declares a singular-in-runtime
 * annotation member as an array.
 *
 * @Redirect, @ModifyArg, @ModifyArgs and @ModifyVariable take one @At. When the
 * Mixin on the compile classpath declares at() as At[] instead, javac silently
 * auto-wraps `at = @At(...)` into `at = [@At(...)]` -- legal Java, compiles
 * clean, and then MixinExtras casts that attribute to a single AnnotationNode
 * at apply time and throws ClassCastException. The client dies before the
 * window opens and the stack trace names neither the mixin nor the mod.
 *
 * Checking the classpath rather than our source is the point: our source was
 * correct both times. What was wrong was what it compiled against.
 */
tasks.register('checkMixinAnnotationShape') {
    dependsOn 'remapJar'
    doLast {
        def urls = configurations.compileClasspath.files.collect { it.toURI().toURL() } as URL[]
        def cl = new URLClassLoader(urls, (ClassLoader) null)
        def bad = []
        ['Redirect', 'ModifyArg', 'ModifyArgs', 'ModifyVariable'].each { name ->
            try {
                def type = cl.loadClass("org.spongepowered.asm.mixin.injection.${name}")
                        .getMethod('at').returnType
                if (type.isArray()) bad << "@${name}.at() is ${type.simpleName}"
            } catch (Throwable t) {
                logger.warn("could not inspect @${name}: ${t}")
            }
        }
        if (bad) {
            throw new GradleException(
                "Mixin on the compile classpath has array-valued at(): " + bad.join(', ')
                + ". Building against this produces at=[@At(...)] on injectors that take a "
                + "single @At, which MixinExtras rejects at apply time. Pin loader_version "
                + "to a release whose Mixin declares these singular.")
        }
    }
}

tasks.named('check') { dependsOn 'checkMixinAnnotationShape' }

/**
 * Checks every @Inject handler's parameters against the method it targets.
 *
 * Mixin matches an @Inject to its target by raw descriptor. A parameter of the
 * wrong type compiles clean and then throws InvalidInjectionException during
 * apply -- fatal whatever defaultRequire says, before the window opens. Three
 * of those shipped in a row, each found only by crashing the game, so the build
 * resolves the target on the remapped classpath and compares for itself.
 *
 * Types are compared by simple name. That cannot distinguish two classes that
 * share one, which is a trade for not having to resolve every import; the
 * failure it is here to catch is a wholly different type in a slot, and that it
 * catches reliably.
 */
tasks.register('checkInjectSignatures') {
    dependsOn 'remapJar'
    def mixinDir = file('src/main/java/dev/kryptic/mixin')
    inputs.dir mixinDir
    doLast {
        def urls = configurations.compileClasspath.files.collect { it.toURI().toURL() } as URL[]
        def cl = new URLClassLoader(urls, (ClassLoader) null)
        def problems = []

        mixinDir.eachFileMatch(~/.*\.java/) { f ->
            def src = f.text
            def tm = src =~ /@Mixin\(\{?\s*(\w+)\.class/
            if (!tm.find()) return
            def targetSimple = tm.group(1)
            def im = src =~ /import\s+([\w.]*\.\Q${targetSimple}\E);/
            if (!im.find()) return
            def target
            try {
                target = cl.loadClass(im.group(1))
            } catch (Throwable ignored) {
                return                       // accessors and the like
            }

            // every @Inject block, with the handler that follows it
            def m = src =~ /(?s)@Inject\s*\((.*?)\)\s*(?:private|public|protected)\s+(?:static\s+)?[\w.<>\[\]$]+\s+(\w+)\s*\(([^)]*)\)/
            while (m.find()) {
                def spec = m.group(1), handler = m.group(2)
                def nm = spec =~ /method\s*=\s*\{?\s*"([^"(]+)/
                if (!nm.find()) continue
                def methodName = nm.group(1).trim()

                def params = m.group(3).split(',')*.trim().findAll { it }
                        .collect { it.split(/\s+/)[-2] }           // the type, not the name
                        .findAll { !(it in ['CallbackInfo', 'CallbackInfoReturnable']) }

                def candidates = target.declaredMethods.findAll { it.name == methodName }
                if (candidates.isEmpty()) continue                 // handled by require/@At

                def ok = candidates.any { c ->
                    def real = c.parameterTypes*.simpleName
                    real.size() == params.size() &&
                        [real, params].transpose().every { r, p -> r == p }
                }
                if (!ok) {
                    problems << "${f.name}#${handler} declares (${params.join(', ')}) but " +
                        "${targetSimple}.${methodName} is " +
                        candidates.collect { "(${it.parameterTypes*.simpleName.join(', ')})" }.join(' or ')
                }
            }
        }

        if (problems) {
            throw new GradleException("@Inject parameters do not match their target "
                + "(Mixin will reject these at apply time and the client will not start):\n  "
                + problems.join('\n  '))
        }
        logger.lifecycle('checkInjectSignatures: every @Inject matches its target')
    }
}

tasks.named('check') { dependsOn 'checkInjectSignatures' }

// TEMPORARY: Chams. Rather than fight 1.21.11's entity render pipeline, the
// cheap route is vanilla's own outline pass -- it already draws through
// terrain, which is the whole point of chams. That needs isGlowing/hasOutline
// and a colour hook, and none of those names are worth guessing at.
tasks.register('chamsProbe') {
    dependsOn 'remapJar'
    doLast {
        def urls = configurations.compileClasspath.files.collect { it.toURI().toURL() } as URL[]
        def cl = new URLClassLoader(urls, (ClassLoader) null)
        [
            'net.minecraft.entity.Entity'                 : ['isGlowing', 'getTeamColorValue', 'setGlowing'],
            'net.minecraft.client.MinecraftClient'        : ['hasOutline'],
            'net.minecraft.client.render.WorldRenderer'   : ['hasOutline', 'drawEntityOutlinesFramebuffer'],
            'net.minecraft.client.render.entity.EntityRenderer' : ['getOutlineColor', 'render'],
        ].each { className, wanted ->
            try {
                def c = cl.loadClass(className)
                println "PROBE ==== ${className}"
                c.declaredMethods.findAll { it.name in wanted }.each {
                    println "PROBE   ${java.lang.reflect.Modifier.toString(it.modifiers)} ${it.returnType.simpleName} ${it.name}(${it.parameterTypes*.simpleName.join(', ')})"
                }
            } catch (Throwable t) {
                println "PROBE ==== ${className} NOT FOUND (${t.class.simpleName})"
            }
        }
    }
}
