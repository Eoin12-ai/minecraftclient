plugins {
    id 'fabric-loom' version '1.17.20'
    id 'java'
}

version = project.mod_version
group   = project.maven_group

base { archivesName = project.archives_base_name }

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft         "com.mojang:minecraft:${project.minecraft_version}"
    mappings          "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // NanoVG is bound at compile time from libs/ and shipped as the nested jars
    // under META-INF/jars. The rest of libs/ was a pre-compiled copy of this mod
    // built against older mappings; it has no business on the compile classpath.
    compileOnly files('libs/lwjgl-nanovg-3.3.3.jar')

    compileOnly 'org.jetbrains:annotations:24.1.0'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.release   = 21
    it.options.encoding  = 'UTF-8'
}

processResources {
    inputs.property 'version', project.version
    filteringCharset 'UTF-8'
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

// TEMPORARY: reads the real 1.21.11 shapes off the remapped jar so the block
// outline traces the right API. Removed once the answer is in hand.
tasks.register('apiProbe') {
    dependsOn 'remapJar'
    doLast {
        def urls = configurations.compileClasspath.files.collect { it.toURI().toURL() } as URL[]
        def cl = new URLClassLoader(urls, (ClassLoader) null)
        ['net.minecraft.block.BlockState',
         'net.minecraft.util.shape.VoxelShape'].each { name ->
            println "PROBE ==== ${name}"
            try {
                cl.loadClass(name).declaredMethods.findAll {
                    it.name.toLowerCase().contains('shape') || it.name.toLowerCase().contains('box')
                }.each { m ->
                    println "PROBE   ${m.returnType.simpleName} ${m.name}(${m.parameterTypes*.simpleName.join(', ')})"
                }
            } catch (Throwable t) {
                println "PROBE   FAILED ${t}"
            }
        }
    }
}
