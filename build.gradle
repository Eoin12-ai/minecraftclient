plugins {
    id 'fabric-loom' version '1.17.20'
    id 'java'
}

version = project.mod_version
group   = project.maven_group

base { archivesName = project.archives_base_name }

loom {
    mixin {
        defaultRefmapName = 'epsteinclient.refmap.json'
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft         "com.mojang:minecraft:${project.minecraft_version}"
    mappings          "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Pre-compiled JAR supplies class_11905/8/9 and other snapshot-only APIs
    // that aren't yet in the stable Yarn mappings
    compileOnly fileTree(dir: 'libs', include: '*.jar')

    compileOnly 'org.jetbrains:annotations:24.1.0'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.release   = 21
    it.options.encoding  = 'UTF-8'
}

processResources {
    inputs.property 'version', project.version
    filteringCharset 'UTF-8'
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

// TEMPORARY probe: dumps the real shape of the 1.21.11 API for every class the
// migration touches, so the renames are read off the jar rather than guessed.
// Delete once the source compiles.
tasks.register('apiProbe') {
    doLast {
        def cp = configurations.compileClasspath.files
        def urls = cp.collect { it.toURI().toURL() } as URL[]
        def loader = new URLClassLoader(urls, (ClassLoader) null)

        // ── part 1: where do these simple names live? ─────────────────────────
        def wanted = ['SkinTextures', 'KeyInput', 'CharInput', 'Click', 'MouseInput',
                      'Window', 'GuiRenderer', 'GlobalSettings', 'GpuBufferSlice',
                      'ProjectionType', 'PlayerSkin'] as Set
        def seen = [:]
        cp.each { f ->
            if (!f.name.endsWith('.jar')) return
            try {
                def zf = new java.util.zip.ZipFile(f)
                try {
                    for (e in zf.entries()) {
                        def n = e.name
                        if (!n.endsWith('.class') || n.contains('$')) continue
                        def simple = n.substring(n.lastIndexOf('/') + 1, n.length() - 6)
                        if (wanted.contains(simple)) {
                            seen.computeIfAbsent(simple, { k -> [] as Set })
                                .add(n.substring(0, n.length() - 6).replace('/', '.'))
                        }
                    }
                } finally { zf.close() }
            } catch (ignored) { }
        }
        println '=== PROBE LOCATE BEGIN ==='
        wanted.toList().sort().each { w -> println "LOCATE ${w} -> ${seen[w] ?: 'NOT FOUND'}" }
        println '=== PROBE LOCATE END ==='

        // ── part 2: what members do these classes actually have? ──────────────
        def classes = [
            'com.mojang.authlib.GameProfile',
            'net.minecraft.client.render.Camera',
            'net.minecraft.client.render.RenderLayer',
            'net.minecraft.client.sound.PositionedSoundInstance',
            'net.minecraft.client.gui.DrawContext',
            'net.minecraft.client.gui.screen.Screen',
            'net.minecraft.client.gui.ParentElement',
            'net.minecraft.client.gui.Element',
            'net.minecraft.client.gui.screen.ChatScreen',
            'net.minecraft.client.network.AbstractClientPlayerEntity',
            'net.minecraft.client.Keyboard',
            'net.minecraft.client.Mouse',
            'net.minecraft.client.gui.hud.InGameHud',
            'net.minecraft.text.TextVisitFactory',
            'net.minecraft.entity.Entity',
            'net.minecraft.entity.ItemEntity',
            'net.minecraft.client.font.TextRenderer',
        ]
        // members that matter; everything else is noise
        def interesting = ['name', 'id', 'pos', 'skin', 'key', 'char', 'mouse', 'click',
                           'gui', 'line', 'quad', 'emissive', 'master', 'render', 'sidebar',
                           'text', 'visit', 'matrix', 'drawtext', 'sound', 'window'] as List

        println '=== PROBE MEMBERS BEGIN ==='
        classes.each { cn ->
            Class<?> c
            try { c = Class.forName(cn, false, loader) }
            catch (Throwable t) { println "CLASS ${cn} -> UNAVAILABLE (${t.getClass().simpleName})"; return }
            println "CLASS ${cn}"
            c.getDeclaredMethods()
             .findAll { m -> !m.name.startsWith('lambda$') }
             .collect { m -> "  M ${m.name}(${m.parameterTypes.collect { it.simpleName }.join(', ')}) : ${m.returnType.simpleName}" }
             .findAll { line -> interesting.any { line.toLowerCase().contains(it) } }
             .sort()
             .each { println it }
            c.getDeclaredConstructors()
             .collect { m -> "  C <init>(${m.parameterTypes.collect { it.simpleName }.join(', ')})" }
             .sort().each { println it }
            c.getDeclaredFields()
             .collect { f -> "  F ${f.name} : ${f.type.simpleName}" }
             .findAll { line -> interesting.any { line.toLowerCase().contains(it) } }
             .sort().each { println it }
        }
        println '=== PROBE MEMBERS END ==='
    }
}
compileJava.dependsOn 'apiProbe'
