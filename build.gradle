plugins {
    id 'fabric-loom' version '1.17.20'
    id 'java'
}

version = project.mod_version
group   = project.maven_group

base { archivesName = project.archives_base_name }

loom {
    mixin {
        defaultRefmapName = 'epsteinclient.refmap.json'
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft         "com.mojang:minecraft:${project.minecraft_version}"
    mappings          "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Pre-compiled JAR supplies class_11905/8/9 and other snapshot-only APIs
    // that aren't yet in the stable Yarn mappings
    compileOnly fileTree(dir: 'libs', include: '*.jar')

    compileOnly 'org.jetbrains:annotations:24.1.0'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.release   = 21
    it.options.encoding  = 'UTF-8'
}

processResources {
    inputs.property 'version', project.version
    filteringCharset 'UTF-8'
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

// TEMPORARY probe: dumps the real shape of the 1.21.11 API for every class the
// migration touches, so the renames are read off the jar rather than guessed.
// Delete once the source compiles.
tasks.register('apiProbe') {
    doLast {
        def cp = configurations.compileClasspath.files
        def urls = cp.collect { it.toURI().toURL() } as URL[]
        def loader = new URLClassLoader(urls, (ClassLoader) null)

        def dump = { String cn, List<String> interesting ->
            Class<?> c
            try { c = Class.forName(cn, false, loader) }
            catch (Throwable t) { println "CLASS ${cn} -> UNAVAILABLE (${t})"; return }
            println "CLASS ${cn}"
            try {
                c.getDeclaredMethods()
                 .findAll { m -> !m.name.startsWith('lambda$') }
                 .collect { m -> "  M ${m.name}(${m.parameterTypes.collect { it.simpleName }.join(', ')}) : ${m.returnType.simpleName}" }
                 .findAll { line -> interesting.isEmpty() || interesting.any { line.toLowerCase().contains(it) } }
                 .sort().each { println it }
            } catch (Throwable t) { println "  (methods unreadable: ${t})" }
            try {
                c.getDeclaredConstructors()
                 .collect { m -> "  C <init>(${m.parameterTypes.collect { it.simpleName }.join(', ')})" }
                 .sort().each { println it }
            } catch (Throwable t) { println "  (ctors unreadable: ${t})" }
            try {
                c.getDeclaredFields()
                 .collect { f -> "  F ${f.name} : ${f.type.simpleName}" }
                 .findAll { line -> interesting.isEmpty() || interesting.any { line.toLowerCase().contains(it) } }
                 .sort().each { println it }
            } catch (Throwable t) { println "  (fields unreadable: ${t})" }
        }

        println '=== PROBE INPUT BEGIN ==='
        ['net.minecraft.client.input.KeyInput',
         'net.minecraft.client.input.CharInput',
         'net.minecraft.client.input.MouseInput',
         'net.minecraft.client.gui.Click'].each { dump(it, []) }
        println '=== PROBE INPUT END ==='

        println '=== PROBE MEMBERS BEGIN ==='
        dump('net.minecraft.entity.Entity', ['getpos', 'getx', 'gety', 'getz', 'boundingbox'])
        dump('net.minecraft.entity.ItemEntity', ['pos', 'stack'])
        dump('net.minecraft.client.font.TextRenderer', ['getwidth', 'draw'])
        dump('net.minecraft.client.util.Window', ['handle'])
        dump('net.minecraft.client.gl.GlobalSettings', [])
        println '=== PROBE MEMBERS END ==='

        // ── where did the RenderLayer factories go? ───────────────────────────
        def wantedMethods = ['getEntityTranslucentEmissive', 'getLines', 'getDebugQuads',
                             'getGuiTextured', 'getDebugLineStrip', 'getEntityCutoutNoCull'] as Set
        def scanPkgs = ['net/minecraft/client/render/', 'net/minecraft/client/gl/',
                        'net/minecraft/client/gui/render/']
        def candidates = [] as Set
        cp.each { f ->
            if (!f.name.endsWith('.jar')) return
            try {
                def zf = new java.util.zip.ZipFile(f)
                try {
                    for (e in zf.entries()) {
                        def n = e.name
                        if (!n.endsWith('.class') || n.contains('$')) continue
                        if (scanPkgs.any { n.startsWith(it) }) candidates.add(n[0..-7].replace('/', '.'))
                    }
                } finally { zf.close() }
            } catch (ignored) { }
        }
        println "=== PROBE RENDERLAYER BEGIN (scanning ${candidates.size()} classes) ==="
        candidates.sort().each { cn ->
            try {
                def c = Class.forName(cn, false, loader)
                c.getDeclaredMethods().each { m ->
                    if (wantedMethods.contains(m.name)) {
                        println "FOUND ${cn}#${m.name}(${m.parameterTypes.collect { it.simpleName }.join(', ')}) : ${m.returnType.simpleName}"
                    }
                }
            } catch (Throwable ignored) { }
        }
        println '=== PROBE RENDERLAYER END ==='
    }
}
compileJava.dependsOn 'apiProbe'
