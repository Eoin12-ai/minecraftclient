plugins {
    id 'fabric-loom' version '1.17.20'
    id 'java'
}

version = project.mod_version
group   = project.maven_group

base { archivesName = project.archives_base_name }

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft         "com.mojang:minecraft:${project.minecraft_version}"
    mappings          "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // NanoVG is bound at compile time from libs/ and shipped as the nested jars
    // under META-INF/jars. The rest of libs/ was a pre-compiled copy of this mod
    // built against older mappings; it has no business on the compile classpath.
    compileOnly files('libs/lwjgl-nanovg-3.3.3.jar')

    compileOnly 'org.jetbrains:annotations:24.1.0'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.release   = 21
    it.options.encoding  = 'UTF-8'
}

processResources {
    inputs.property 'version', project.version
    filteringCharset 'UTF-8'
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

// TEMPORARY probe: how to reach the main framebuffer's GL texture in 1.21.11.
tasks.register('apiProbe') {
    doLast {
        def cp = configurations.compileClasspath.files
        def loader = new URLClassLoader(cp.collect { it.toURI().toURL() } as URL[], (ClassLoader) null)
        def dump = { String cn ->
            try {
                def c = Class.forName(cn, false, loader)
                println "CLASS ${cn}"
                c.getDeclaredMethods().findAll { !it.name.startsWith('lambda$') }.collect { m ->
                    "  M ${m.name}(${m.parameterTypes.collect { it.simpleName }.join(', ')}) : ${m.returnType.name}"
                }.sort().each { println it }
                c.getDeclaredFields().collect { f -> "  F ${f.name} : ${f.type.name}" }.sort().each { println it }
            } catch (Throwable t) { println "CLASS ${cn} -> ${t}" }
        }
        println '=== PROBE BEGIN ==='
        ['net.minecraft.client.gl.Framebuffer',
         'com.mojang.blaze3d.textures.GpuTexture',
         'com.mojang.blaze3d.textures.GpuTextureView',
         'com.mojang.blaze3d.opengl.GlTexture',
         'com.mojang.blaze3d.opengl.GlTextureView',
         'com.mojang.blaze3d.systems.RenderSystem'].each { dump(it) }
        println '=== PROBE END ==='
    }
}
compileJava.dependsOn 'apiProbe'
