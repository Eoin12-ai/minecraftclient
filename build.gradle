plugins {
    id 'fabric-loom' version '1.17.20'
    id 'java'
}

version = project.mod_version
group   = project.maven_group

base { archivesName = project.archives_base_name }

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft         "com.mojang:minecraft:${project.minecraft_version}"
    mappings          "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // NanoVG is bound at compile time from libs/ and shipped as the nested jars
    // under META-INF/jars. The rest of libs/ was a pre-compiled copy of this mod
    // built against older mappings; it has no business on the compile classpath.
    compileOnly files('libs/lwjgl-nanovg-3.3.3.jar')

    compileOnly 'org.jetbrains:annotations:24.1.0'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.release   = 21
    it.options.encoding  = 'UTF-8'
}

processResources {
    inputs.property 'version', project.version
    filteringCharset 'UTF-8'
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

// TEMPORARY probe: how Minecraft opens a URL on this version.
tasks.register('apiProbe') {
    doLast {
        def cp = configurations.compileClasspath.files
        def loader = new URLClassLoader(cp.collect { it.toURI().toURL() } as URL[], (ClassLoader) null)
        println '=== PROBE BEGIN ==='
        ['net.minecraft.util.Util'].each { cn ->
            try {
                def c = Class.forName(cn, false, loader)
                println "CLASS ${cn}"
                c.getDeclaredMethods()
                 .findAll { it.parameterCount == 0 && !it.name.startsWith('lambda$') }
                 .collect { "  M ${it.name}() : ${it.returnType.name}" }
                 .findAll { it.toLowerCase().contains('operatingsystem') || it.toLowerCase().contains('os') }
                 .sort().unique().each { println it }
            } catch (Throwable t) { println "CLASS ${cn} -> ${t}" }
        }
        // whatever type that returns, dump how it opens things
        def names = [] as Set
        cp.each { f ->
            if (!f.name.endsWith('.jar')) return
            try {
                def zf = new java.util.zip.ZipFile(f)
                try {
                    for (e in zf.entries()) {
                        def n = e.name
                        if (n.endsWith('/OperatingSystem.class') || n.endsWith('$OperatingSystem.class')) {
                            names.add(n[0..-7].replace('/', '.'))
                        }
                    }
                } finally { zf.close() }
            } catch (ignored) { }
        }
        names.each { cn ->
            try {
                def c = Class.forName(cn, false, loader)
                println "CLASS ${cn}"
                c.getDeclaredMethods().collect {
                    "  M ${it.name}(${it.parameterTypes.collect { p -> p.name }.join(', ')}) : ${it.returnType.simpleName}"
                }.sort().each { println it }
            } catch (Throwable t) { println "CLASS ${cn} -> ${t}" }
        }
        println '=== PROBE END ==='
    }
}
compileJava.dependsOn 'apiProbe'
