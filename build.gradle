plugins {
    id 'fabric-loom' version '1.17.20'
    id 'java'
}

version = project.mod_version
group   = project.maven_group

base { archivesName = project.archives_base_name }

loom {
    mixin {
        defaultRefmapName = 'epsteinclient.refmap.json'
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft         "com.mojang:minecraft:${project.minecraft_version}"
    mappings          "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Pre-compiled JAR supplies class_11905/8/9 and other snapshot-only APIs
    // that aren't yet in the stable Yarn mappings
    compileOnly fileTree(dir: 'libs', include: '*.jar')

    compileOnly 'org.jetbrains:annotations:24.1.0'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.release   = 21
    it.options.encoding  = 'UTF-8'
}

processResources {
    inputs.property 'version', project.version
    filteringCharset 'UTF-8'
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

// TEMPORARY probe: dumps the real shape of the 1.21.11 API for every class the
// migration touches, so the renames are read off the jar rather than guessed.
// Delete once the source compiles.
tasks.register('apiProbe') {
    doLast {
        def cp = configurations.compileClasspath.files
        def urls = cp.collect { it.toURI().toURL() } as URL[]
        def loader = new URLClassLoader(urls, (ClassLoader) null)

        println '=== PROBE ENTITY BEGIN ==='
        ['net.minecraft.entity.Entity'].each { cn ->
            try {
                def c = Class.forName(cn, false, loader)
                println "CLASS ${cn} extends ${c.superclass?.name} implements ${c.interfaces*.name}"
                c.getDeclaredMethods()
                 .findAll { m -> m.returnType.simpleName in ['Vec3d', 'Box', 'BlockPos'] && m.parameterCount == 0 }
                 .collect { m -> "  M ${m.name}() : ${m.returnType.simpleName}" }
                 .sort().each { println it }
            } catch (Throwable t) { println "  ${cn} -> ${t}" }
        }
        println '=== PROBE ENTITY END ==='

        // every class on the client that hands back a RenderLayer
        def all = [] as Set
        cp.each { f ->
            if (!f.name.endsWith('.jar')) return
            try {
                def zf = new java.util.zip.ZipFile(f)
                try {
                    for (e in zf.entries()) {
                        def n = e.name
                        if (!n.endsWith('.class') || n.contains('$')) continue
                        if (n.startsWith('net/minecraft/')) all.add(n[0..-7].replace('/', '.'))
                    }
                } finally { zf.close() }
            } catch (ignored) { }
        }
        println "=== PROBE RENDERLAYER BEGIN (scanning ${all.size()} classes) ==="
        all.sort().each { cn ->
            try {
                def c = Class.forName(cn, false, loader)
                c.getDeclaredMethods().each { m ->
                    if (m.returnType.simpleName == 'RenderLayer' && java.lang.reflect.Modifier.isStatic(m.modifiers)) {
                        println "RL ${cn}#${m.name}(${m.parameterTypes.collect { it.simpleName }.join(', ')})"
                    }
                }
            } catch (Throwable ignored) { }
        }
        println '=== PROBE RENDERLAYER END ==='
    }
}
compileJava.dependsOn 'apiProbe'
