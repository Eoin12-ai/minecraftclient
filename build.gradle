plugins {
    id 'fabric-loom' version '1.17.20'
    id 'java'
}

version = project.mod_version
group   = project.maven_group

base { archivesName = project.archives_base_name }

loom {
    mixin {
        defaultRefmapName = 'epsteinclient.refmap.json'
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft         "com.mojang:minecraft:${project.minecraft_version}"
    mappings          "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // NanoVG is bound at compile time from libs/ and shipped as the nested jars
    // under META-INF/jars. The rest of libs/ was a pre-compiled copy of this mod
    // built against older mappings; it has no business on the compile classpath.
    compileOnly files('libs/lwjgl-nanovg-3.3.3.jar')

    compileOnly 'org.jetbrains:annotations:24.1.0'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.release   = 21
    it.options.encoding  = 'UTF-8'
}

processResources {
    inputs.property 'version', project.version
    filteringCharset 'UTF-8'
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

// TEMPORARY probe: the last few shapes the migration still needs.
tasks.register('apiProbe') {
    doLast {
        def cp = configurations.compileClasspath.files
        def loader = new URLClassLoader(cp.collect { it.toURI().toURL() } as URL[], (ClassLoader) null)
        println '=== PROBE BEGIN ==='
        ['net.minecraft.entity.player.SkinTextures',
         'com.mojang.authlib.GameProfile',
         'net.minecraft.world.entity.EntityLike'].each { cn ->
            try {
                def c = Class.forName(cn, false, loader)
                println "CLASS ${cn}"
                c.getDeclaredMethods().collect { m ->
                    "  M ${m.name}(${m.parameterTypes.collect { it.simpleName }.join(', ')}) : ${m.returnType.simpleName}"
                }.sort().each { println it }
                c.getDeclaredFields().collect { f -> "  F ${f.name} : ${f.type.simpleName}" }.sort().each { println it }
            } catch (Throwable t) { println "CLASS ${cn} -> ${t}" }
        }
        // which supertype of Entity still hands back a position?
        try {
            def e = Class.forName('net.minecraft.entity.Entity', false, loader)
            e.getMethods().findAll { it.parameterCount == 0 && it.returnType.simpleName == 'Vec3d' }
             .collect { "  ENTITY ${it.declaringClass.simpleName}#${it.name}() : Vec3d" }
             .unique().sort().each { println it }
        } catch (Throwable t) { println "entity scan -> ${t}" }
        println '=== PROBE END ==='
    }
}
compileJava.dependsOn 'apiProbe'
