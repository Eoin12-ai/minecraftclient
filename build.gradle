plugins {
    id 'fabric-loom' version '1.10-SNAPSHOT'
    id 'java'
}

version = project.mod_version
group   = project.maven_group

base { archivesName = project.archives_base_name }

loom {
    mixin {
        defaultRefmapName = 'epsteinclient.refmap.json'
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

configurations {
    localDeps
}

dependencies {
    minecraft         "com.mojang:minecraft:${project.minecraft_version}"
    mappings          "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Pre-compiled JAR supplies class_11905/8/9 and other snapshot-only APIs
    // that aren't yet in the stable Yarn mappings
    compileOnly fileTree(dir: 'libs', include: '*.jar')

    compileOnly 'org.jetbrains:annotations:24.1.0'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.release   = 21
    it.options.encoding  = 'UTF-8'
}

processResources {
    inputs.property 'version', project.version
    filteringCharset 'UTF-8'
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

// TEMPORARY probe: prints the real yarn package for the simple class names used
// in mixin @At targets. Removed once the targets are corrected.
tasks.register('mcNames') {
    doLast {
        def wanted = ['GuiRenderer', 'GlobalSettings', 'ProjectionType', 'SimpleOption',
                      'GameOptions', 'Perspective', 'MathHelper', 'ComponentType',
                      'Camera', 'RenderTickCounter', 'TextRenderer', 'DrawContext',
                      'StringVisitable', 'Text', 'ItemStack', 'GpuBufferSlice'] as Set
        def seen = [:]
        def cp = configurations.findByName('compileClasspath')
        if (cp != null) {
            cp.resolve().each { f ->
                if (!f.name.endsWith('.jar')) return
                try {
                    def zf = new java.util.zip.ZipFile(f)
                    try {
                        for (e in zf.entries()) {
                            def n = e.name
                            if (!n.endsWith('.class') || n.contains('$')) continue
                            def simple = n.substring(n.lastIndexOf('/') + 1, n.length() - 6)
                            if (wanted.contains(simple)) {
                                seen.computeIfAbsent(simple, { k -> [] as Set })
                                    .add(n.substring(0, n.length() - 6))
                            }
                        }
                    } finally { zf.close() }
                } catch (ignored) { }
            }
        }
        println '=== MCNAMES BEGIN ==='
        wanted.toList().sort().each { w -> println "MCNAME ${w} -> ${seen[w] ?: 'NOT FOUND'}" }
        println '=== MCNAMES END ==='
    }
}
compileJava.dependsOn 'mcNames'
