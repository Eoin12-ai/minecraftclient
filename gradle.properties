org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.configuration-cache=false

minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
# Matches the loader people actually run. Newer Loader ships a Mixin in
# which @Redirect/@ModifyArg/@ModifyArgs/@ModifyVariable declare at() as an
# array; compiling against that makes javac auto-wrap a single @At into
# at=[...], and MixinExtras 0.5.4 casts that attribute to one AnnotationNode
# -- ClassCastException, fatal, before the window opens.
loader_version=0.19.3
fabric_version=0.141.6+1.21.11
mod_version=1.6.2
maven_group=dev.kryptic
archives_base_name=krypticclient
