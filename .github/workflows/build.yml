name: Build JAR

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.13'
          cache-read-only: false

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: |
          set +e
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
          EXIT=${PIPESTATUS[0]}
          if [ $EXIT -ne 0 ]; then
            git config user.email "ci@build.dev"
            git config user.name "CI"
            cp /tmp/build.log build-error.log
            git add build-error.log
            git commit -m "ci: build error log"
            git push
          fi
          exit $EXIT
        env:
          GRADLE_OPTS: '-Xmx3g'

      - name: List build output
        if: success()
        run: ls -l build/libs

      - name: Upload JAR artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: epsteinclient-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
