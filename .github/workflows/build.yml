name: Build JAR

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.13'
          cache-read-only: false

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Probe Loom versions
        run: |
          echo "=== fabric-loom plugin versions ==="
          curl -sS https://maven.fabricmc.net/net/fabricmc/fabric-loom/fabric-loom.gradle.plugin/maven-metadata.xml \
            | grep -oE '<version>[^<]+</version>' | sed 's/<[^>]*>//g' | tail -25
          echo "=== latest/release ==="
          curl -sS https://maven.fabricmc.net/net/fabricmc/fabric-loom/fabric-loom.gradle.plugin/maven-metadata.xml \
            | grep -oE '<(latest|release)>[^<]+</(latest|release)>'

      - name: Build
        run: |
          set +e
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
          EXIT=${PIPESTATUS[0]}
          if [ $EXIT -ne 0 ]; then
            git config user.email "ci@build.dev"
            git config user.name "CI"
            cp /tmp/build.log build-error.log
            git add build-error.log
            git commit -m "ci: build error log"
            git push
          fi
          exit $EXIT
        env:
          GRADLE_OPTS: '-Xmx3g'

      - name: List build output
        if: success()
        run: ls -l build/libs

      - name: Upload JAR artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: epsteinclient-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

      # Artifact downloads are served from a blob host that some networks block,
      # so a manual run also publishes the jar to a throwaway orphan branch that
      # can be fetched over plain git. The branch is built with git plumbing, so
      # the working tree is untouched, and it is force-replaced each run.
      - name: Publish jar to claude/build-output branch
        if: success() && github.event_name == 'workflow_dispatch'
        run: |
          set -eu
          JAR=""
          for f in build/libs/*.jar; do
            case "$f" in
              *-sources.jar|*-dev.jar|*-sources-dev.jar) continue ;;
            esac
            JAR="$f"
            break
          done
          if [ -z "$JAR" ]; then
            echo "no publishable jar in build/libs"
            ls -l build/libs || true
            exit 1
          fi
          NAME=$(basename "$JAR")
          echo "publishing $NAME"
          git config user.email "ci@build.dev"
          git config user.name "CI"
          SUM=$(sha256sum "$JAR" | cut -d' ' -f1)
          BLOB=$(git hash-object -w "$JAR")
          INFO=$(printf 'commit: %s\nref:    %s\nrun:    %s\njar:    %s\nsha256: %s\n' \
                   "$GITHUB_SHA" "$GITHUB_REF" "$GITHUB_RUN_ID" "$NAME" "$SUM" \
                 | git hash-object -w --stdin)
          TREE=$(printf '100644 blob %s\t%s\n100644 blob %s\tBUILD_INFO.txt\n' \
                   "$BLOB" "$NAME" "$INFO" | git mktree)
          COMMIT=$(git commit-tree "$TREE" -m "build: $NAME from $GITHUB_SHA")
          git push --force origin "$COMMIT:refs/heads/claude/build-output"
          echo "published $NAME sha256=$SUM as commit $COMMIT"
